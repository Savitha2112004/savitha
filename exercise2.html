<!DOCTYPE html>
<html>
    <head>
        <title>program using prompt and alert</title>
    </head>
    <body>
        <script>
            let a= Number(prompt("enter the first number"));
            let b=Number(prompt("enter the second number"));
            alert(a+b);
            alert(a-b);
            alert(a*b);
        </script>
    </body>
</html>
